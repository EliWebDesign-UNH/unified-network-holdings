<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- UNH logo: SMALL VERSION (v7-simple) — "Flower of Life" -->
  <!-- Designed to read at 16-32px (favicon size) -->
  <!-- Just 1 center circle + 6 outer circles in a 6-fold symmetric arrangement -->

  <g transform="translate(120,120)">
    <defs>
      <linearGradient id="v7grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c8ff00"/>
        <stop offset="100%" stop-color="#88c000"/>
      </linearGradient>
    </defs>

    <!-- Outer ring: filled with gradient, with a navy border for definition -->
    <circle cx="0" cy="0" r="110" fill="url(#v7grad)"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#0a1929" stroke-width="3"/>

    <!-- Inner negative space (navy) -->
    <circle cx="0" cy="0" r="92" fill="#0a1929"/>

    <!-- Central circle -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="url(#v7grad)" stroke-width="3"/>

    <!-- 6 equal outer circles at 60° intervals, all tangent to the central circle -->
    <g fill="none" stroke="url(#v7grad)" stroke-width="3">
      <circle cx="48" cy="0" r="24"/>
      <circle cx="24" cy="-41.57" r="24"/>
      <circle cx="-24" cy="-41.57" r="24"/>
      <circle cx="-48" cy="0" r="24"/>
      <circle cx="-24" cy="41.57" r="24"/>
      <circle cx="24" cy="41.57" r="24"/>
    </g>
  </g>
</svg>
