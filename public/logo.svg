<svg xmlns="http://w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Unified Network Holdings v6: Symmetric Circle Fractal -->
  <!-- A mandala-like fractal: central circle, 6 equal circles around it at 60° intervals, -->
  <!-- with smaller circles filling the gaps. Perfectly symmetrical (6-fold rotational). -->
  <!-- Same neon green + navy color scheme as v5. -->

  <defs>
    <linearGradient id="unhFractal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8ff00"/>
      <stop offset="100%" stop-color="#88c000"/>
    </linearGradient>
  </defs>

  <g transform="translate(120,120)">
    <!-- Outer ring: the frame, filled with the gradient (so the inner negative space stands out) -->
    <!-- Using stroke only on the outer ring to keep the background see-through -->
    <circle cx="0" cy="0" r="110" fill="url(#unhFractal)"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#0a1929" stroke-width="3"/>

    <!-- Inner negative space (navy) for the fractal to sit on, with a thin border -->
    <circle cx="0" cy="0" r="95" fill="#0a1929"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#0a1929" stroke-width="1" opacity="0.5"/>

    <!-- Central circle: the heart of the fractal -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#unhFractal)" stroke-width="2.5"/>

    <!-- 6 equal circles around the center, at 60° intervals, all tangent to the central circle -->
    <!-- For a tangent configuration: distance from center = 2 * radius -->
    <!-- Radius = 22, so distance = 44 -->
    <g fill="none" stroke="url(#unhFractal)" stroke-width="2">
      <!-- 0° (right) -->
      <circle cx="44" cy="0" r="22"/>
      <!-- 60° (top-right) -->
      <circle cx="22" cy="-38.1" r="22"/>
      <!-- 120° (top-left) -->
      <circle cx="-22" cy="-38.1" r="22"/>
      <!-- 180° (left) -->
      <circle cx="-44" cy="0" r="22"/>
      <!-- 240° (bottom-left) -->
      <circle cx="-22" cy="38.1" r="22"/>
      <!-- 300° (bottom-right) -->
      <circle cx="22" cy="38.1" r="22"/>
    </g>

    <!-- Smaller circles in the gaps between adjacent outer circles (recursion level 1) -->
    <!-- The gaps form small lens shapes; placing circles in the centers of those gaps -->
    <!-- creates the self-similar pattern. 6 gaps, one circle each. -->
    <g fill="url(#unhFractal)">
      <!-- Gap between 0° and 60° circle, positioned at 30° from center at distance 44 -->
      <circle cx="36.4" cy="-22" r="4"/>
      <!-- Gap between 60° and 120° -->
      <circle cx="0" cy="-51" r="4"/>
      <!-- Gap between 120° and 180° -->
      <circle cx="-36.4" cy="-22" r="4"/>
      <!-- Gap between 180° and 240° -->
      <circle cx="-36.4" cy="22" r="4"/>
      <!-- Gap between 240° and 300° -->
      <circle cx="0" cy="51" r="4"/>
      <!-- Gap between 300° and 0° -->
      <circle cx="36.4" cy="22" r="4"/>
    </g>

    <!-- Even smaller circles in the gaps between the central circle and each outer circle (recursion level 2) -->
    <!-- 6 small dots positioned midway between center and each outer circle -->
    <g fill="url(#unhFractal)">
      <circle cx="22" cy="0" r="3"/>
      <circle cx="11" cy="-19" r="3"/>
      <circle cx="-11" cy="-19" r="3"/>
      <circle cx="-22" cy="0" r="3"/>
      <circle cx="-11" cy="19" r="3"/>
      <circle cx="11" cy="19" r="3"/>
    </g>

    <!-- Tiny accent dots at the outer edge (the "stardust" between fractal elements) -->
    <g fill="url(#unhFractal)" opacity="0.6">
      <!-- 6 dots positioned just inside the outer ring, at 60° intervals -->
      <circle cx="80" cy="0" r="2"/>
      <circle cx="40" cy="-69.3" r="2"/>
      <circle cx="-40" cy="-69.3" r="2"/>
      <circle cx="-80" cy="0" r="2"/>
      <circle cx="-40" cy="69.3" r="2"/>
      <circle cx="40" cy="69.3" r="2"/>
    </g>
  </g>
</svg>
