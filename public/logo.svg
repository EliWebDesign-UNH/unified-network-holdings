<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Unified Network Holdings: hexagonal fractal, centered composition -->
  <!-- Outer hexagon contains a smaller concentric hexagon, with a node-hex at each outer vertex -->
  <!-- All elements share the same centroid; visual weight is balanced -->

  <defs>
    <linearGradient id="unhGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8ff00"/>
      <stop offset="100%" stop-color="#88c000"/>
    </linearGradient>
  </defs>

  <g transform="translate(100,100)">
    <!-- Outer hexagon: regular, vertices at 60-deg intervals, radius 70 -->
    <!-- A regular hexagon: vertex angles at 0, 60, 120, 180, 240, 300 -->
    <polygon
      points="70,0 35,60.62 -35,60.62 -70,0 -35,-60.62 35,-60.62"
      fill="none"
      stroke="url(#unhGrad)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Inner hexagon: smaller, rotated 30 deg for visual depth, centered -->
    <polygon
      points="35,0 17.5,30.31 -17.5,30.31 -35,0 -17.5,-30.31 17.5,-30.31"
      fill="none"
      stroke="url(#unhGrad)"
      stroke-width="1.5"
      stroke-linejoin="round"
      opacity="0.7"
    />

    <!-- Center: small filled hexagon (the "core") -->
    <polygon
      points="12,0 6,10.39 -6,10.39 -12,0 -6,-10.39 6,-10.39"
      fill="url(#unhGrad)"
    />

    <!-- Small hexagons at each outer vertex (the "recursive" / fractal part) -->
    <!-- Sized to fit within the outer hex bounds; centered on the same centroid -->
    <g>
      <!-- Top-right vertex (70, 0) -->
      <polygon points="70,0 65.5,7.79 56.5,7.79 52,0 56.5,-7.79 65.5,-7.79" fill="url(#unhGrad)" opacity="0.9"/>
      <!-- Right-bottom vertex (35, 60.62) -->
      <polygon points="35,60.62 30.5,68.41 21.5,68.41 17,60.62 21.5,52.83 30.5,52.83" fill="url(#unhGrad)" opacity="0.9"/>
      <!-- Left-bottom vertex (-35, 60.62) -->
      <polygon points="-35,60.62 -39.5,68.41 -48.5,68.41 -53,60.62 -48.5,52.83 -39.5,52.83" fill="url(#unhGrad)" opacity="0.9"/>
      <!-- Left vertex (-70, 0) -->
      <polygon points="-70,0 -74.5,7.79 -83.5,7.79 -88,0 -83.5,-7.79 -74.5,-7.79" fill="url(#unhGrad)" opacity="0.9"/>
      <!-- Left-top vertex (-35, -60.62) -->
      <polygon points="-35,-60.62 -39.5,-52.83 -48.5,-52.83 -53,-60.62 -48.5,-68.41 -39.5,-68.41" fill="url(#unhGrad)" opacity="0.9"/>
      <!-- Right-top vertex (35, -60.62) -->
      <polygon points="35,-60.62 30.5,-52.83 21.5,-52.83 17,-60.62 21.5,-68.41 30.5,-68.41" fill="url(#unhGrad)" opacity="0.9"/>
    </g>

    <!-- Connection lines from center to each outer vertex (the "unified network") -->
    <g stroke="url(#unhGrad)" stroke-width="1" opacity="0.5" stroke-linecap="round">
      <line x1="0" y1="0" x2="70" y2="0"/>
      <line x1="0" y1="0" x2="35" y2="60.62"/>
      <line x1="0" y1="0" x2="-35" y2="60.62"/>
      <line x1="0" y1="0" x2="-70" y2="0"/>
      <line x1="0" y1="0" x2="-35" y2="-60.62"/>
      <line x1="0" y1="0" x2="35" y2="-60.62"/>
    </g>
  </g>
</svg>
