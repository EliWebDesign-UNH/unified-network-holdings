<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Unified Network Holdings v5: Apollonian Gasket Fractal inside a Circle -->
  <!-- A literal fractal: large outer circle, with smaller circles recursively packed into the gaps. -->
  <!-- The pattern is self-similar — each new gap gets its own small circle, which creates more gaps, which get more circles, etc. -->
  <!-- Strong visual structure + mathematical beauty = reads instantly as "cool fractal in a circle". -->

  <defs>
    <linearGradient id="unhApollonian" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8ff00"/>
      <stop offset="100%" stop-color="#88c000"/>
    </linearGradient>
    <clipPath id="outerCircle">
      <!-- Mask everything to the outer circle so gasket circles that extend beyond get clipped -->
      <circle cx="120" cy="120" r="100"/>
    </clipPath>
  </defs>

  <g transform="translate(120,120)">
    <!-- Outer circle: filled background, no stroke (so the gasket fills the whole interior) -->
    <circle cx="0" cy="0" r="100" fill="url(#unhApollonian)"/>

    <!-- Largest inner circle (the "white" of the gasket) - centered slightly above middle -->
    <!-- Real Apollonian gasket: largest inner circle is tangent to outer at the top -->
    <circle cx="0" cy="-50" r="50" fill="none" stroke="#0a1929" stroke-width="2"/>
    <!-- The two smaller circles flanking it (Descartes' Circle Theorem) -->
    <circle cx="-43.3" cy="25" r="25" fill="none" stroke="#0a1929" stroke-width="2"/>
    <circle cx="43.3" cy="25" r="25" fill="none" stroke="#0a1929" stroke-width="2"/>

    <!-- Even smaller circles in the gaps (level 2) -->
    <!-- The gap between the big top circle and the bottom-left circle -->
    <circle cx="-23" cy="-15" r="12" fill="none" stroke="#0a1929" stroke-width="1.5"/>
    <!-- The gap between the big top circle and the bottom-right circle -->
    <circle cx="23" cy="-15" r="12" fill="none" stroke="#0a1929" stroke-width="1.5"/>
    <!-- The gap between the two bottom circles -->
    <circle cx="0" cy="35" r="12" fill="none" stroke="#0a1929" stroke-width="1.5"/>

    <!-- Level 3: tiny circles in the next round of gaps -->
    <circle cx="-12" cy="0" r="5" fill="none" stroke="#0a1929" stroke-width="1"/>
    <circle cx="12" cy="0" r="5" fill="none" stroke="#0a1929" stroke-width="1"/>
    <circle cx="0" cy="-25" r="5" fill="none" stroke="#0a1929" stroke-width="1"/>
    <circle cx="-22" cy="20" r="4" fill="none" stroke="#0a1929" stroke-width="1"/>
    <circle cx="22" cy="20" r="4" fill="none" stroke="#0a1929" stroke-width="1"/>
    <circle cx="0" cy="48" r="4" fill="none" stroke="#0a1929" stroke-width="1"/>

    <!-- Level 4: even tinier dots in remaining gaps (just accents) -->
    <circle cx="-6" cy="-8" r="2" fill="#0a1929"/>
    <circle cx="6" cy="-8" r="2" fill="#0a1929"/>
    <circle cx="-6" cy="10" r="2" fill="#0a1929"/>
    <circle cx="6" cy="10" r="2" fill="#0a1929"/>
    <circle cx="-15" cy="0" r="1.5" fill="#0a1929"/>
    <circle cx="15" cy="0" r="1.5" fill="#0a1929"/>

    <!-- Outer ring border (the frame) -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#0a1929" stroke-width="3"/>
  </g>
</svg>
