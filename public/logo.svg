<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Unified Network Holdings v4: Hexagonal Sierpinski Fractal -->
  <!-- A proper hex Sierpinski subdivision: outer hex is divided into 7 sub-hexes -->
  <!-- (1 center + 6 around), and that subdivision is recursively applied. -->
  <!-- Math: sub-hex side = outer hex side / 3. -->

  <defs>
    <linearGradient id="unhFractal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8ff00"/>
      <stop offset="100%" stop-color="#88c000"/>
    </linearGradient>
  </defs>

  <g transform="translate(120,120)">
    <!-- OUTER HEX: side length 100, vertices at angles 0, 60, 120, 180, 240, 300 from center -->
    <!-- For a regular hexagon, vertex = side-length distance from center, so radius = 100 -->
    <!-- Vertices: (100,0), (50,86.6), (-50,86.6), (-100,0), (-50,-86.6), (50,-86.6) -->
    <polygon
      points="100,0 50,86.6 -50,86.6 -100,0 -50,-86.6 50,-86.6"
      fill="none"
      stroke="url(#unhFractal)"
      stroke-width="2"
    />

    <!-- LEVEL 1 SUBDIVISION into 7 sub-hexes (correct Sierpinski hex math) -->
    <!-- Sub-hex side = 100/3 ≈ 33.33, so sub-hex "radius" (center to vertex) = 33.33 -->

    <!-- Center sub-hex: centered at origin, side 33.33 -->
    <polygon
      points="33.33,0 16.67,28.87 -16.67,28.87 -33.33,0 -16.67,-28.87 16.67,-28.87"
      fill="url(#unhFractal)"
    />

    <!-- 6 sub-hexes around the center, each sharing one edge with the center hex -->
    <!-- Sub-hex position = (sub-hex radius) * (unit vector toward adjacent center-hex edge midpoint) -->
    <!-- Adjacent edge midpoints of center hex are at: -->
    <!--   right  : (33.33, 0)         -> sub-hex at (66.67, 0) -->
    <!--   top-right: (16.67, -28.87)  -> sub-hex at (33.33, -57.74) -->
    <!--   top-left:  (-16.67, -28.87) -> sub-hex at (-33.33, -57.74) -->
    <!--   left:   (-33.33, 0)        -> sub-hex at (-66.67, 0) -->
    <!--   bot-left:  (-16.67, 28.87)  -> sub-hex at (-33.33, 57.74) -->
    <!--   bot-right: (16.67, 28.87)   -> sub-hex at (33.33, 57.74) -->

    <!-- Right sub-hex (at 66.67, 0) - filled, showing recursion -->
    <g transform="translate(66.67, 0)">
      <polygon
        points="33.33,0 16.67,28.87 -16.67,28.87 -33.33,0 -16.67,-28.87 16.67,-28.87"
        fill="none"
        stroke="url(#unhFractal)"
        stroke-width="1.5"
      />
      <!-- Level 2 subdivision: 7 even smaller hexes inside this one (side ~11.11) -->
      <polygon
        points="11.11,0 5.56,9.62 -5.56,9.62 -11.11,0 -5.56,-9.62 5.56,-9.62"
        fill="url(#unhFractal)"
      />
    </g>

    <!-- Top-right sub-hex (at 33.33, -57.74) -->
    <g transform="translate(33.33, -57.74)">
      <polygon
        points="33.33,0 16.67,28.87 -16.67,28.87 -33.33,0 -16.67,-28.87 16.67,-28.87"
        fill="none"
        stroke="url(#unhFractal)"
        stroke-width="1.5"
      />
      <polygon
        points="11.11,0 5.56,9.62 -5.56,9.62 -11.11,0 -5.56,-9.62 5.56,-9.62"
        fill="url(#unhFractal)"
      />
    </g>

    <!-- Top-left sub-hex (at -33.33, -57.74) -->
    <g transform="translate(-33.33, -57.74)">
      <polygon
        points="33.33,0 16.67,28.87 -16.67,28.87 -33.33,0 -16.67,-28.87 16.67,-28.87"
        fill="none"
        stroke="url(#unhFractal)"
        stroke-width="1.5"
      />
      <polygon
        points="11.11,0 5.56,9.62 -5.56,9.62 -11.11,0 -5.56,-9.62 5.56,-9.62"
        fill="url(#unhFractal)"
      />
    </g>

    <!-- Left sub-hex (at -66.67, 0) -->
    <g transform="translate(-66.67, 0)">
      <polygon
        points="33.33,0 16.67,28.87 -16.67,28.87 -33.33,0 -16.67,-28.87 16.67,-28.87"
        fill="none"
        stroke="url(#unhFractal)"
        stroke-width="1.5"
      />
      <polygon
        points="11.11,0 5.56,9.62 -5.56,9.62 -11.11,0 -5.56,-9.62 5.56,-9.62"
        fill="url(#unhFractal)"
      />
    </g>

    <!-- Bottom-left sub-hex (at -33.33, 57.74) -->
    <g transform="translate(-33.33, 57.74)">
      <polygon
        points="33.33,0 16.67,28.87 -16.67,28.87 -33.33,0 -16.67,-28.87 16.67,-28.87"
        fill="none"
        stroke="url(#unhFractal)"
        stroke-width="1.5"
      />
      <polygon
        points="11.11,0 5.56,9.62 -5.56,9.62 -11.11,0 -5.56,-9.62 5.56,-9.62"
        fill="url(#unhFractal)"
      />
    </g>

    <!-- Bottom-right sub-hex (at 33.33, 57.74) -->
    <g transform="translate(33.33, 57.74)">
      <polygon
        points="33.33,0 16.67,28.87 -16.67,28.87 -33.33,0 -16.67,-28.87 16.67,-28.87"
        fill="none"
        stroke="url(#unhFractal)"
        stroke-width="1.5"
      />
      <polygon
        points="11.11,0 5.56,9.62 -5.56,9.62 -11.11,0 -5.56,-9.62 5.56,-9.62"
        fill="url(#unhFractal)"
      />
    </g>
  </g>
</svg>
